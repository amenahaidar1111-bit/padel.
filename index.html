async function bulkStock(){const n=parseInt($('#bs').value,10);if(isNaN(n)||n<0)return alert('Enter a stock number (0 or more).');const L=AL();if(!L.length)return alert('No rackets are shown.');const np=L.filter(r=>!(+r.price>0)).length;if(!confirm('Set stock to '+n+' for '+L.length+' rackets shown? This replaces their current stock.'+(np?'\n'+np+' have no price and still cannot be sold.':'')))return;const ids=L.map(r=>r.id);for(let i=0;i<ids.length;i+=40){if(!await dbq(sb.from('store_products').update({stock:n}).in('id',ids.slice(i,i+40))))return}await load();route();alert('Stock set to '+n+' for '+L.length+' rackets.')}
// PHOTOS: pick from gallery -> resized in the browser -> Supabase Storage (bucket racket-images, admin-only writes)
const slug=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\+/g,'plus').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
async function shrink(file,max=1000){let bm;try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bm=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Could not process this photo')),'image/jpeg',.85))}
async function upBlob(blob,key){const path=(key||'racket')+'-'+Date.now().toString(36)+'.jpg';const{error}=await sb.storage.from('racket-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;return sb.storage.from('racket-images').getPublicUrl(path).data.publicUrl}
async function upImg(inp){const f=inp.files[0];if(!f)return;const st=$('#ims');try{st.textContent='Processing and uploading…';const url=await upBlob(await shrink(f),slug((window._r&&window._r.name)||'racket'));document.querySelector('[data-k=img]').value=url;const im=$('#imp');im.src=url;im.style.display='';const n=$('#imn');if(n)n.style.display='none';st.textContent='Photo uploaded. Tap Save to keep it.'}catch(e){console.error('Photo upload failed:',e);st.textContent='Upload failed: '+(e.message||e)}}
async function bulkImg(inp){const fs=[...inp.files];inp.value='';if(!fs.length)return;const st=$('#ust');const byName={},byModel={};R.forEach(r=>{const a=slug(r.name),b=slug(r.model);(byName[a]=byName[a]||[]).push(r);(byModel[b]=byModel[b]||[]).push(r)});let ok=0;const bad=[];
for(let i=0;i<fs.length;i++){const f=fs[i],k=slug(f.name.replace(/\.[^.]+$/,''));const m=(byName[k]&&byName[k].length===1&&byName[k])||(byModel[k]&&byModel[k].length===1&&byModel[k]);if(!m){bad.push(f.name);continue}
try{st.textContent='Uploading '+(i+1)+' of '+fs.length+'…';const url=await upBlob(await shrink(f),k);if(await dbq(sb.from('store_products').update({images:[url]}).eq('id',m[0].id)))ok++;else bad.push(f.name)}catch(e){console.error(e);bad.push(f.name+' (failed)')}}
await load();route();alert('Photos saved: '+ok+' of '+fs.length+'.'+(bad.length?'\nNot matched or failed ('+bad.length+'):\n'+bad.slice(0,10).join('\n')+(bad.length>10?'\n…':''):''))}
async function importCat(){if(!confirm('Add the 148-racket catalog (inactive, unverified, no price)? Existing rackets are kept.'))return;if(await dbq(sb.from('store_products').upsert(IMP.map(r=>({brand:r.brand,model:r.model,year:r.year===''?null:r.year,active:false,stock:0})),{onConflict:'brand,model',ignoreDuplicates:true}))){await load();route()}}
function admin(){if(!au)return `<div class="w sec" style="max-width:380px"><h2>Admin</h2><label for="lp">Admin PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p><button class="btn" onclick="login()">Unlock</button></p></div>`;
const tabs=`<div class="tabs">${[['r','Rackets'],['o','Orders ('+O.length+')'],['d','Delivery']].map(t=>`<button class="btn sm ${at===t[0]?'':'o'}" onclick="at='${t[0]}';ed=null;${t[0]==='o'?'loadOrders().then(route)':'route()'}">${t[1]}</button>`).join('')}<button class="btn sm o" onclick="logout()">Sign out</button></div>`;
if(at==='o')return `<div class="w sec"><h2>Orders</h2>${tabs}<div class="sc"><table><tr><th>Order</th><th>Customer / delivery</th><th>Items</th><th>Total</th><th>Status</th></tr>${O.map(o=>`<tr><td>${esc(o.order_no)}<br><span class="m">${esc(o.created_at.slice(0,10))}</span></td><td><b>${esc(o.name)}</b><br>${esc(o.phone)}<br><span class="m">${esc(o.zone_name)}, ${esc(o.area)}, ${esc(o.street)}, bldg ${esc(o.bldg)}${o.floor?', fl '+esc(o.floor):''}${o.apt?', apt '+esc(o.apt):''}<br>Landmark: ${esc(o.landmark)}<br>${esc(o.notes)}</span></td><td>${o.items.map(x=>esc(x.name)+' ×'+x.q).join('<br>')}</td><td>${fmt(o.total)}<br><span class="m">incl. ${fmt(o.delivery_fee)} delivery · COD</span></td><td><select onchange="setSt('${o.id}',this.value)">${ST.map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5 class="m">No orders yet.</td></tr>'}</table></div></div>`;
if(at==='d')return `<div class="w sec"><h2>Delivery zones</h2>${tabs}<p class="m">New zones start inactive. Set the fee, then tick active.</p>${Z.map(z=>`<div class="row" style="margin:8px 0"><input value="${esc(z.n)}" onchange="zUp('${z.id}','name',this.value)" aria-label="Zone name"><input type="number" min="0" step="0.5" value="${z.f}" onchange="zUp('${z.id}','fee',+this.value)" style="max-width:110px" aria-label="Fee"><label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${z.on?'checked':''} onchange="zUp('${z.id}','active',this.checked)"> active</label></div>`).join('')}<button class="btn sm" onclick="dbq(sb.from('store_delivery_zones').insert({name:'New zone',fee:0,active:false})).then(()=>load().then(route))">Add zone</button></div>`;
if(ed){const r=ed==='new'?{id:'new',brand:'',model:'',price:'',sale:'',stock:0,pub:false,img:'',desc:'',...SPEC}:R.find(x=>x.id===ed);
const F=(k,l,t='text')=>`<label>${l}</label><input data-k="${k}" type="${t}" value="${esc(r[k])}">`,S=(k,l,o)=>`<label>${l}</label><select data-k="${k}"><option value="">—</option>${o.map(x=>`<option ${x===r[k]?'selected':''}>${x}</option>`).join('')}</select>`;
window._r=r;return `<div class="w sec" style="max-width:640px"><h2>${ed==='new'?'Add racket':'Edit racket'}</h2>${tabs}<div id="ef">${F('brand','Brand')}${F('model','Model')}${F('year','Year','number')}<label><input type="checkbox" data-k="ver" style="width:auto;min-height:0" ${r.ver?'checked':''}> Specs verified against real sources (makes it eligible for the Finder)</label>${F('price','Price','number')}${F('sale','Sale price (blank = none)','number')}<label>Racket photo</label><div class="img" style="max-width:240px"><img id="imp" src="${esc(r.img)}" alt="" ${r.img?'':'style="display:none"'}>${r.img?'':'<span id="imn">No photo yet</span>'}</div><input type="file" accept="image/*" onchange="upImg(this)"><p class="m" id="ims">Choose a photo from your gallery. It is resized automatically.</p><input type="hidden" data-k="img" value="${esc(r.img)}"><p class="m">Bulk file name: ${slug(r.name||'')||'(save first)'}.jpg</p>${F('weight','Weight (g)','number')}${S('shape','Shape',['round','teardrop','hybrid','diamond'])}${S('balance','Balance',['low','even','high'])}${S('level','Level (min)',LV)}${S('level_max','Level (max, optional)',LV)}${S('style','Style',['defensive','balanced','aggressive'])}${SK.map(k=>F(k,k+' (0–100)','number')).join('')}${F('surface','Surface')}${F('core','Core')}${F('str','Strengths')}${F('wk','Weaknesses')}${F('tags','Tags (comma separated)')}${F('stock','Stock','number')}<label>Description</label><textarea data-k="desc" rows="3">${esc(r.desc)}</textarea><label><input type="checkbox" data-k="pub" style="width:auto;min-height:0" ${r.pub?'checked':''}> Published</label></div><p><button class="btn" onclick="saveR()">Save</button> <button class="btn o" onclick="ed=null;route()">Cancel</button></p></div>`}
return `<div class="w sec"><h2>Rackets</h2>${tabs}<button class="btn sm" onclick="ed='new';route()">Add racket</button> <button class="btn sm o" onclick="importCat()">Import catalog</button> <button class="btn sm" onclick="pubAll()">Publish all shown</button><p><input id="bs" type="number" min="0" step="1" inputmode="numeric" placeholder="Stock" style="max-width:110px" aria-label="Stock quantity"> <button class="btn sm" onclick="bulkStock()">Set stock for all shown</button></p><p><button class="btn sm" onclick="$('#bf').click()">Upload photos (bulk)</button><input type="file" id="bf" accept="image/*" multiple style="display:none" onchange="bulkImg(this)"> <span class="m">File name = racket name, e.g. nox-at10-luxury-genius-18k-alum-2026.jpg</span></p><p class="m" id="ust"></p><p><input placeholder="Search rackets" value="${esc(aq)}" onchange="aq=this.value;route()" aria-label="Search rackets"></p><div class="tabs">${[['all','All'],['pub','Published'],['hid','Hidden'],['unv','Unverified']].map(f=>`<button class="btn sm ${af===f[0]?'':'o'}" onclick="af='${f[0]}';route()">${f[1]}</button>`).join('')}</div><p class="m">Showing ${AL().length} of ${R.length}</p><div class="sc"><table>${AL().map(r=>`<tr><td>${esc(r.name)}${r.ver?'':' <span class="badge">UNVERIFIED</span>'}</td><td>${r.price?fmt(r.price):'no price'}</td><td>Stock ${r.stock}${r.stock>0&&r.stock<3?' <span class="badge">LOW</span>':''}</td><td>${r.pub?'Published':'Hidden'}</td><td><button class="btn sm o" onclick="ed='${r.id}';route()">Edit</button> <button class="btn sm o" onclick="togP('${r.id}',${!r.pub})">${r.pub?'Unpublish':'Publish'}</button></td></tr>`).join('')||'<tr><td class="m">No rackets found. Try another search, or tap Import catalog.</td></tr>'}</table></div></div>`}
async function saveR(){const r=window._r;document.querySelectorAll('#ef [data-k]').forEach(e=>{const k=e.dataset.k;r[k]=e.type==='checkbox'?e.checked:e.value===''?null:e.type==='number'?+e.value:e.value});
if(r.ver&&[...SK,'shape','balance','weight','level'].some(k=>r[k]==null))return alert('To mark specs verified, fill every 0–100 spec plus shape, balance, weight and level with real data.');
if(!r.brand||!r.model||r.price==null||isNaN(+r.price))return alert('Brand, model and price are required');if(r.pub&&!(+r.price>0))return alert('A published racket needs a price above 0.');
const prod={brand:r.brand,model:r.model,year:r.year||null,description:r.desc,price:+r.price,sale_price:r.sale==null?null:+r.sale,images:r.img?[r.img]:[],stock:+r.stock||0,active:!!r.pub};let id=r.id;
if(ed==='new'){const{data,error}=await sb.from('store_products').insert(prod).select('id').single();if(error)return alert('Save failed: '+error.message);id=data.id}else if(!await dbq(sb.from('store_products').update(prod).eq('id',id)))return;
const pf={product_id:id,verified:!!r.ver,active:!!r.ver,weight_min:r.weight===r._wa&&r._wmin!=null?r._wmin:r.weight,weight_max:r.weight===r._wa&&r._wmax!=null?r._wmax:r.weight,tags:(r.tags||'').split(',').map(x=>x.trim()).filter(Boolean)};for(const c in FM)pf[FM[c]]=r[c]??null;
if(!await dbq(sb.from('store_racket_profiles').upsert(pf,{onConflict:'product_id'})))return;ed=null;await load();route();scrollTo(0,0);alert('Saved. The website now shows the updated racket.')}
// ROUTER
function route(){const h=location.hash.slice(1)||'/',a=$('#app');let x;
if(h==='/')x=home();else if(h==='/finder')x=finder();else if(h==='/store')x=store();else if(h.startsWith('/p/'))x=prod(h.slice(3));else if(h==='/checkout')x=checkout();else if(h==='/done')x=done();else if(h==='/admin')x=admin();else x=`<div class="w sec"><h2>Page not found</h2><a class="btn" href="#/">Home</a></div>`;
a.innerHTML=x;bindCheckout();fx();const q=$('#sq');if(q){q.oninput=e=>{flt.q=e.target.value;const p=e.target.selectionStart;route();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};$('#ss').onchange=e=>{flt.sort=e.target.value;route()}}
document.title=h.startsWith('/p/')&&R.find(r=>r.id===h.slice(3))?R.find(r=>r.id===h.slice(3)).name+' — Padel':'Padel Racket Finder & Store'}

// FX
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let io;
function fx(){if(location.hash==='#/checkout'||rm){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('#app .card,#app .sec>h2,#app .sum').forEach((e,i)=>{if(!e.classList.contains('rv')){e.classList.add('rv');e.style.transitionDelay=(i%4)*70+'ms'}});
document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
if(!rm){addEventListener('pointermove',e=>{const h=$('#rkw');if(h){h.style.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(2));h.style.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(2))}
const c=e.target.closest&&e.target.closest('.card.h');if(c&&e.pointerType==='mouse'){const r=c.getBoundingClientRect();c.style.transform=`perspective(700px) rotateY(${((e.clientX-r.left)/r.width-.5)*8}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*8}deg) translateY(-4px)`}
const b=e.target.closest&&e.target.closest('.btn');if(b&&e.pointerType==='mouse'){const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.12}px,${(e.clientY-r.top-r.height/2)*.2}px)`}});
addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.card.h,.btn');if(t)t.style.transform=''});
addEventListener('scroll',()=>{$('#sp').style.width=scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100+'%'},{passive:true})}
if(!rm&&!sessionStorage.getItem('seen')){document.documentElement.style.setProperty('--bd','1.7s');setTimeout(()=>$('#intro').classList.add('go'),1500);setTimeout(()=>{$('#intro').remove();document.documentElement.style.setProperty('--bd','0s')},2500)}else $('#intro').remove();
sessionStorage.setItem('seen','1');
addEventListener('hashchange',()=>{route();scrollTo(0,0)});cart();route();load().then(()=>{cart();route()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ed&&location.hash!=='#/checkout')load().then(()=>{cart();route()})});
</script></body></html>
